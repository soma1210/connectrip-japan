# Checks on every pull request into main (2026-11-26): the unit tests, including the SEO
# guard (src/website-v1/seoGuard.test.ts) that fails when a merge brings back an older
# meta description, sitemap, structured data, H1, www redirect, robots.txt, canonical,
# noindex rule, GA4 / Cookie Consent wiring, privacy policy, booking / inquiry rules or IndexNow.
# Read-only; it never deploys. To make it block merges: Settings → Rules → require "Checks / unit".

name: Checks

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: 1.4.0
      - run: bun install --frozen-lockfile
      - run: bun --no-env-file run test:unit
