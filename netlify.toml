# Netlify build for the Next.js app (Guide Community).
#
# The mkdir works around a bug in @netlify/plugin-nextjs (<= 5.16.4): with
# Next 16's Node.js-runtime proxy (src/proxy.ts) it writes
# server/functions-config-manifest.json into the server handler before that
# folder exists (ENOENT). The adapter clears this folder in onPreBuild and fills
# it in onBuild; the build command runs in between, so pre-creating it is safe.
[build]
  command = "bun run build && mkdir -p .netlify/functions-internal/___netlify-server-handler/.next/server"

# Redirects that were added to the live site at deploy time on 2026-10-28 and
# never committed. Kept here so a rebuild from Git serves the same site.
[[redirects]]
  from = "/admin"
  to = "https://connectrip-japan-v1.netlify.app/admin"
  status = 302
  force = true

[[redirects]]
  from = "/admin/*"
  to = "https://connectrip-japan-v1.netlify.app/admin"
  status = 302
  force = true

# Partner applications moved to Google Forms (2026-11-02). These pointed to
# the standalone survey (connectrip-partner-survey.netlify.app), which stays
# up until its removal is planned, as does the old form under
# src/app/[locale]/partner/apply.
[[redirects]]
  from = "/partner/apply"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfl91wJlinZ4i178QnBE_zS4Rd3O4JPXerJT4LT8_MQgz2_0g/viewform"
  status = 302
  force = true

[[redirects]]
  from = "/:locale/partner/apply"
  to = "https://docs.google.com/forms/d/e/1FAIpQLSfl91wJlinZ4i178QnBE_zS4Rd3O4JPXerJT4LT8_MQgz2_0g/viewform"
  status = 302
  force = true

# Guide applications moved to Google Forms (2026-11-01). The old form under
# src/app/guide-community stays in the code until its removal is planned.
[[redirects]]
  from = "/guide-community"
  to = "https://docs.google.com/forms/d/e/1FAIpQLScUcnWv2X9W64-UyRaPi_e6-rXVRD8AnzCh5C6CSjfbXZ_lIA/viewform"
  status = 302
  force = true
